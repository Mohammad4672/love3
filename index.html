<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Ruba Choices 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  text-align:center;
  overflow:hidden;
  background:url("https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=80");
  background-size:cover;
}

#overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
}

#lock{
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

input{
  padding:10px;
  border-radius:10px;
  border:none;
  text-align:center;
}

button{
  margin-top:10px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#6c63ff;
  color:white;
  cursor:pointer;
}

#game{display:none; position:relative; z-index:5;}

#story{
  margin-top:80px;
  font-size:22px;
  width:80%;
  margin-left:auto;
  margin-right:auto;
}

.choice-btn{
  margin:10px;
  padding:15px 25px;
  border:none;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
}

.good{background:#4caf50; color:white;}
.bad{background:#ff4d6d; color:white;}

#result{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.8);
  padding:25px;
  border-radius:15px;
  display:none;
}
</style>
</head>

<body>

<div id="overlay"></div>

<!-- lock -->
<div id="lock">
  <h2>🔐 Password</h2>
  <input id="pass" type="password" placeholder="Enter password">
  <button onclick="start()">Start</button>
</div>

<!-- game -->
<div id="game">

  <h1>💖 Ruba Story Game</h1>

  <div id="story"></div>

  <div id="choices"></div>

</div>

<div id="result"></div>

<script>
const password="RubaChoice";

let score=0;
let step=0;

const scenes=[
  {
    text:"روبا بعثتلك رسالة… شو بتعمل؟",
    choices:[
      {t:"برد فوراً 💌", v:2},
      {t:"بستنى شوي 😏", v:-1}
    ]
  },
  {
    text:"شفتها أونلاين…",
    choices:[
      {t:"بحكي معها فوراً 💖", v:2},
      {t:"بتجاهلها شوي", v:-2}
    ]
  },
  {
    text:"طلبت منك وقتها…",
    choices:[
      {t:"بعطيها كل وقتي ⏳", v:2},
      {t:"بقول مشغول", v:-2}
    ]
  },
  {
    text:"روبا زعلانة…",
    choices:[
      {t:"براضيها فوراً 💖", v:3},
      {t:"بتركها تهدى لحالها", v:-3}
    ]
  }
];

function start(){
  if(document.getElementById("pass").value!==password){
    alert("غلط 😏");
    return;
  }

  document.getElementById("lock").style.display="none";
  document.getElementById("game").style.display="block";

  loadScene();
}

function loadScene(){
  if(step>=scenes.length){
    finish();
    return;
  }

  let s=scenes[step];

  document.getElementById("story").innerText=s.text;

  let c=document.getElementById("choices");
  c.innerHTML="";

  s.choices.forEach(ch=>{
    let b=document.createElement("button");
    b.innerText=ch.t;
    b.className="choice-btn "+(ch.v>0?"good":"bad");

    b.onclick=()=>{
      score+=ch.v;
      step++;
      loadScene();
    };

    c.appendChild(b);
  });
}

function finish(){
  let msg="";

  if(score>=5){
    msg="💖 رووبا قرّبت منك كثير… إنت اخترت الصح ✨<br><br>أنا معك لآخر نفس";
  } else if(score>=0){
    msg="😏 في مشاعر… بس الطريق مو واضح بالكامل";
  } else {
    msg="💔 الخيارات بعدتك… بس لسه في فرصة ترجع";
  }

  document.getElementById("result").style.display="block";
  document.getElementById("result").innerHTML=msg;
}
</script>

</body>
</html>
