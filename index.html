<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Ruba Gift Game 🎁</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  overflow:hidden;
  text-align:center;
  color:white;
  background: linear-gradient(135deg,#141e30,#243b55);
}

/* score */
#score{
  position:fixed;
  top:15px;
  left:15px;
  font-size:20px;
}

/* boxes */
.box{
  position:absolute;
  width:65px;
  height:65px;
  border-radius:15px;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(0,0,0,0.25);
  animation: float 1.6s infinite ease-in-out;
}

/* ribbon */
.box::before{
  content:"";
  position:absolute;
  width:100%;
  height:7px;
  background:white;
  top:50%;
  transform:translateY(-50%);
  opacity:0.8;
}

.box::after{
  content:"";
  position:absolute;
  width:7px;
  height:100%;
  background:white;
  left:50%;
  transform:translateX(-50%);
  opacity:0.8;
}

@keyframes float{
  0%{transform:translateY(0px) scale(1);}
  100%{transform:translateY(6px) scale(1.05);}
}

/* message */
#msg{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.75);
  padding:18px;
  border-radius:12px;
  font-size:18px;
  display:none;
}

/* BIG BOX */
#bigBox{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0);
  width:160px;
  height:160px;
  background: linear-gradient(135deg,#ffd700,#ff9f1c);
  border-radius:25px;
  display:none;
  justify-content:center;
  align-items:center;
  font-size:75px;
  cursor:pointer;
  box-shadow:0 0 30px gold;
  opacity:0;
  transition:0.5s ease;
}

#bigBox.open{
  transform:translate(-50%,-50%) scale(1);
  opacity:1;
  animation: shake 0.4s ease;
}

@keyframes shake{
  0%{transform:translate(-50%,-50%) scale(1);}
  25%{transform:translate(-50%,-50%) scale(1.05) rotate(-3deg);}
  50%{transform:translate(-50%,-50%) scale(1.05) rotate(3deg);}
  100%{transform:translate(-50%,-50%) scale(1);}
}

/* glow burst */
.burst{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:20px;
  height:20px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 20px #fff, 0 0 40px #ffd700;
  animation: burst 0.8s ease-out forwards;
  pointer-events:none;
}

@keyframes burst{
  0%{transform:translate(-50%,-50%) scale(1); opacity:1;}
  100%{transform:translate(-50%,-50%) scale(25); opacity:0;}
}
</style>
</head>

<body>

<div id="score">Boxes: 0 / 10</div>
<div id="bigBox">🎁</div>
<div id="msg"></div>

<script>

let count = 0;

/* 10 MESSAGES */
const messages = [
  "💖 ربى انتِ حلوة كتير",
  "✨ ضحكتك بتحلي الدنيا",
  "💫 وجودك بيعمل فرق",
  "🎀 إنتِ مميزة بدون ما تحاولي",
  "💛 قلبك اطيب قلب",
  "🌟 إنتِ احلى شي بالحياة",
  "💖 فيكي طاقة إيجابية",
  "✨ بحبك كتيرررر",
  "💫 بموت فيكِ",
  "🎁 إنتِ أجمل صدفة صارت بحياتي"
];

/* random colors */
function randomColor(){
  let colors=["#ff4d6d","#ffb703","#8ecae6","#90be6d","#c77dff","#ff6b6b"];
  return colors[Math.floor(Math.random()*colors.length)];
}

/* spawn boxes */
setInterval(()=>{
  if(count >= 10) return;

  let box=document.createElement("div");
  box.className="box";
  box.style.background=`linear-gradient(135deg,${randomColor()},#ffffff33)`;

  box.style.left=Math.random()*window.innerWidth+"px";
  box.style.top="-70px";

  document.body.appendChild(box);

  let fall=setInterval(()=>{
    let top=parseFloat(box.style.top);
    box.style.top=(top+5)+"px";

    if(top>window.innerHeight){
      box.remove();
      clearInterval(fall);
    }
  },20);

  /* click */
  box.onclick=()=>{

    count++;
    document.getElementById("score").innerText="Boxes: "+count+" / 10";

    let msg=document.getElementById("msg");
    msg.style.display="block";
    msg.innerHTML=messages[count-1];

    setTimeout(()=>msg.style.display="none",1200);

    box.remove();
    clearInterval(fall);

    if(count===10){
      showBigBox();
    }
  };

},700);

/* big box */
function showBigBox(){
  let big=document.getElementById("bigBox");
  big.style.display="flex";

  setTimeout(()=>{
    big.classList.add("open");
  },100);

  big.onclick=()=>{

    /* glow burst */
    for(let i=0;i<6;i++){
      let b=document.createElement("div");
      b.className="burst";
      document.body.appendChild(b);
      setTimeout(()=>b.remove(),800);
    }

    setTimeout(()=>{
      document.getElementById("msg").style.display="block";
      document.getElementById("msg").innerHTML=`
💖 FOR ROUBA 💖<br><br>

كل صندوق كان كلمة… وكل كلمة كانت شعور ✨<br><br>

وبالنهاية… هيدي اللمعة يلي طلعت بهيدا الصندوق بتعني انو انتِ وجودك بخلي كل شي يلمع 💫
`;
    },400);
  };
}

</script>

</body>
</html>
