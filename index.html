<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Ruba Gift Game 🎁</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  margin:0;
  font-family:Arial;
  overflow:hidden;
  text-align:center;
  color:white;

  background:
  radial-gradient(circle at top left, rgba(255,255,255,0.15) 2px, transparent 2px),
  radial-gradient(circle at bottom right, rgba(255,255,255,0.12) 2px, transparent 2px),
  radial-gradient(circle, rgba(255,182,193,0.25) 1px, transparent 1px),
  linear-gradient(135deg,#1a1a40,#3a0ca3,#7209b7,#f72585);

  background-size:
  120px 120px,
  160px 160px,
  40px 40px,
  cover;

  position:relative;
}

/* stars & hearts */
body::before{
  content:"💖 ✨ ⭐ 💫 💖 ⭐";
  position:absolute;
  top:20px;
  left:20px;
  font-size:22px;
  opacity:0.25;
  letter-spacing:25px;
}

body::after{
  content:"⭐ 💖 ✨ 💫 ⭐ 💖";
  position:absolute;
  bottom:20px;
  right:20px;
  font-size:22px;
  opacity:0.25;
  letter-spacing:25px;
}

/* score */
#score{
  position:fixed;
  top:15px;
  left:15px;
  font-size:20px;
}

/* boxes */
.box{
  position:absolute;
  width:65px;
  height:65px;
  border-radius:15px;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,0.25);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:26px;
}

/* message */
#msg{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.75);
  padding:18px;
  border-radius:12px;
  font-size:18px;
  display:none;
  min-width:220px;
}

/* BIG BOX */
#bigBox{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0);
  width:160px;
  height:160px;
  background: linear-gradient(135deg,#ffd700,#ff9f1c);
  border-radius:25px;
  display:none;
  justify-content:center;
  align-items:center;
  font-size:75px;
  cursor:pointer;
  box-shadow:0 0 30px gold;
  opacity:0;
  transition:0.4s ease;
}

#bigBox.open{
  transform:translate(-50%,-50%) scale(1);
  opacity:1;
}

/* glow burst */
.burst{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:20px;
  height:20px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 20px #fff, 0 0 40px #ffd700;
  animation: burst 0.8s ease-out forwards;
}

@keyframes burst{
  0%{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
  }

  100%{
    transform:translate(-50%,-50%) scale(25);
    opacity:0;
  }
}

</style>
</head>

<body>

<div id="score">Boxes: 0 / 10</div>

<div id="bigBox">🎁</div>

<div id="msg"></div>

<script>

let count = 0;

/* messages */
const messages = [
  "💖 ربى انتِ حلوة كتير",
  "✨ ضحكتك بتحلي الدنيا",
  "💫 وجودك بيعمل فرق",
  "🎀 إنتِ مميزة بدون ما تحاولي",
  "💛 قلبك اطيب قلب",
  "🌟 إنتِ احلى شي بالحياة",
  "💖 دخيل عيونك الحلوين",
  "✨ بحبك كتيرررر",
  "💫 بموت فيكِ",
  "🎁 إنتِ أجمل صدفة صارت بحياتي"
];

/* typing effect */
function typeMessage(text, element, speed = 35){

  element.innerHTML = "";

  let i = 0;

  function typing(){

    if(i < text.length){

      element.innerHTML += text.charAt(i);

      i++;

      setTimeout(typing, speed);
    }
  }

  typing();
}

/* random colors */
function randomColor(){

  let colors = [
    "#ff4d6d",
    "#ffb703",
    "#8ecae6",
    "#90be6d",
    "#c77dff",
    "#ff6b6b"
  ];

  return colors[Math.floor(Math.random()*colors.length)];
}

/* spawn boxes */
setInterval(()=>{

  if(count >= 10) return;

  let box = document.createElement("div");

  box.className = "box";

  box.style.background =
  `linear-gradient(135deg,${randomColor()},#ffffff33)`;

  box.innerHTML = "🎁";

  box.style.left =
  Math.random()*window.innerWidth + "px";

  box.style.top = "-70px";

  document.body.appendChild(box);

  let fall = setInterval(()=>{

    let top = parseFloat(box.style.top);

    box.style.top = (top + 4) + "px";

    if(top > window.innerHeight){

      box.remove();

      clearInterval(fall);
    }

  },20);

  /* click */
  box.onclick = ()=>{

    count++;

    document.getElementById("score").innerText =
    "Boxes: " + count + " / 10";

    let msg = document.getElementById("msg");

    msg.style.display = "block";

    typeMessage(messages[count-1], msg);

    setTimeout(()=>{
      msg.style.display = "none";
    },1400);

    box.remove();

    clearInterval(fall);

    if(count === 10){

      showBigBox();
    }
  };

},700);

/* BIG BOX */
function showBigBox(){

  let big = document.getElementById("bigBox");

  big.style.display = "flex";

  setTimeout(()=>{
    big.classList.add("open");
  },100);

  big.onclick = ()=>{

    /* glow burst */
    for(let i=0;i<6;i++){

      let b = document.createElement("div");

      b.className = "burst";

      document.body.appendChild(b);

      setTimeout(()=>{
        b.remove();
      },800);
    }

    /* final message */
    setTimeout(()=>{

      let msg = document.getElementById("msg");

      msg.style.display = "block";

      typeMessage(
`💖 FOR Ruba 💖

كل صندوق كان كلمة… وكل كلمة كانت شعور ✨

وبالنهاية… هيدي اللمعة يلي طلعت بهيدا الصندوق بتعني انو انتِ وجودك بخلي كل شي يلمع 💫`,
      msg,
      30
      );

    },400);
  };
}

</script>

</body>
</html>
