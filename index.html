<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Ruba Walk 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  overflow:hidden;
  text-align:center;
  color:white;
  background: url("https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=80");
  background-size:cover;
}

/* overlay */
#overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
}

/* lock */
#lock{
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

input{
  padding:10px;
  border-radius:10px;
  border:none;
  text-align:center;
}

button{
  margin-top:10px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#6c63ff;
  color:white;
  cursor:pointer;
}

/* game */
#game{display:none; position:relative; z-index:5;}

#status{
  font-size:20px;
  margin-top:20px;
}

#heartBox{
  font-size:80px;
  margin-top:60px;
}

#btn{
  margin-top:30px;
  padding:15px 30px;
  font-size:18px;
  border:none;
  border-radius:12px;
  background:#ff4d6d;
  color:white;
  cursor:pointer;
}

/* broken heart animation */
.broken{
  animation:break 0.5s;
}

@keyframes break{
  0%{transform:scale(1);}
  50%{transform:scale(1.3) rotate(10deg);}
  100%{transform:scale(0.8) rotate(-10deg);}
}

/* stars */
.star{
  position:absolute;
  color:white;
  animation:fall linear infinite;
  opacity:0.9;
}

@keyframes fall{
  0%{transform:translateY(-10vh);}
  100%{transform:translateY(110vh);}
}

/* message */
#msg{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.7);
  padding:25px;
  border-radius:15px;
  display:none;
}
</style>
</head>

<body>

<div id="overlay"></div>

<!-- lock -->
<div id="lock">
  <h2>🔐 Password</h2>
  <input id="pass" type="password" placeholder="Enter password">
  <button onclick="start()">Start</button>
</div>

<!-- game -->
<div id="game">
  <h1>🚶‍♂️ Ruba Walk Challenge</h1>

  <div id="status">💖 Hearts: 0 / 5</div>

  <div id="heartBox">💖</div>

  <button id="btn" onclick="walk()">Walk 💫</button>
</div>

<!-- message -->
<div id="msg"></div>

<script>
const password="RubaWalk";

let hearts=0;

function start(){
  if(document.getElementById("pass").value!==password){
    alert("غلط 😏");
    return;
  }

  document.getElementById("lock").style.display="none";
  document.getElementById("game").style.display="block";

  stars();
}

/* walk mechanic */
function walk(){
  let winChance = Math.random();

  if(winChance > 0.35){
    hearts++;
    document.getElementById("status").innerText = "💖 Hearts: "+hearts+" / 5";

    document.getElementById("heartBox").innerText="💖";

  } else {
    // lose heart
    document.getElementById("heartBox").innerText="💔";
    document.getElementById("heartBox").classList.add("broken");

    setTimeout(()=>{
      document.getElementById("heartBox").classList.remove("broken");
      document.getElementById("heartBox").innerText="💖";
    },500);
  }

  if(hearts>=5){
    win();
  }
}

/* win message */
function win(){
  document.getElementById("msg").style.display="block";
  document.getElementById("msg").innerHTML=`
💖 SECRET MESSAGE TO ROUBA 💖<br><br>

مش مهم كم مرة خسرت 💔<br>
المهم إني كل مرة برجع أمشي لإلك 💫<br><br>

وصلتِ لهون… يعني كسبتي قلبي 5 مرات 💖<br><br>

روبا… إنتِ الهدف مش المرحلة ✨
`;
}

/* stars */
function stars(){
  for(let i=0;i<80;i++){
    let s=document.createElement("div");
    s.className="star";
    s.innerHTML="✦";
    s.style.left=Math.random()*100+"vw";
    s.style.fontSize=(6+Math.random()*14)+"px";
    s.style.animationDuration=(2+Math.random()*4)+"s";
    document.body.appendChild(s);
  }
}
</script>

</body>
</html>
