<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Ruba Boss Game 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  overflow:hidden;
  text-align:center;
  color:white;
  background:url("https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?auto=format&fit=crop&w=1600&q=80");
  background-size:cover;
}

#overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.35);
}

#startScreen{
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

button{
  padding:12px 25px;
  border:none;
  border-radius:10px;
  background:#6c63ff;
  color:white;
  cursor:pointer;
}

#game{display:none; position:relative;}

#score{
  font-size:20px;
  margin-top:10px;
}

.item{
  position:absolute;
  font-size:35px;
}

#player{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  font-size:50px;
}

.star{
  position:absolute;
  color:white;
  animation:fall linear infinite;
  opacity:0.9;
}

@keyframes fall{
  0%{transform:translateY(-10vh);}
  100%{transform:translateY(110vh);}
}

#msg{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.7);
  padding:20px;
  border-radius:12px;
  display:none;
}

#boss{
  position:absolute;
  font-size:80px;
  display:none;
  cursor:pointer;
  filter: drop-shadow(0 0 20px gold);
}
</style>
</head>

<body>

<div id="overlay"></div>

<div id="startScreen">
  <h1>🎁 Ruba Boss Game</h1>
