<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Ruba Boss Game 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  overflow:hidden;
  text-align:center;
  color:white;
  background:url("https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?auto=format&fit=crop&w=1600&q=80");
  background-size:cover;
}

#overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.35);
}

#startScreen{
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

button{
  padding:12px 25px;
  border:none;
  border-radius:10px;
  background:#6c63ff;
  color:white;
  cursor:pointer;
}

#game{display:none; position:relative;}

#score{
  font-size:20px;
  margin-top:10px;
}

.item{
  position:absolute;
  font-size:35px;
}

#player{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  font-size:50px;
}

.star{
  position:absolute;
  color:white;
  animation:fall linear infinite;
  opacity:0.9;
}

@keyframes fall{
  0%{transform:translateY(-10vh);}
  100%{transform:translateY(110vh);}
}

#msg{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.7);
  padding:20px;
  border-radius:12px;
  display:none;
}

#boss{
  position:absolute;
  font-size:80px;
  display:none;
  cursor:pointer;
  filter: drop-shadow(0 0 20px gold);
}
</style>
</head>

<body>

<div id="overlay"></div>

<div id="startScreen">
  <h1>🎁 Ruba Boss Game</h1>
  <button onclick="startGame()">Start</button>
</div>

<div id="game">
  <div id="score">Score: 0</div>
  <div id="player">🧺</div>
</div>

<div id="msg"></div>

<script>
let score=0;
let bossActive=false;
let bossHits=0;

/* start */
function startGame(){
  document.getElementById("startScreen").style.display="none";
  document.getElementById("game").style.display="block";

  setInterval(dropItem,800);
  stars();
}

/* player movement */
document.addEventListener("mousemove",(e)=>{
  let p=document.getElementById("player");
  p.style.left=e.clientX+"px";
});

/* items */
function dropItem(){
  if(bossActive) return;

  let items=["🎁","💖","⭐","🎀","💎"];
  let el=document.createElement("div");
  el.className="item";

  el.innerHTML=items[Math.floor(Math.random()*items.length)];

  el.style.left=Math.random()*window.innerWidth+"px";
  el.style.top="-50px";

  document.getElementById("game").appendChild(el);

  let fall=setInterval(()=>{

    let top=parseFloat(el.style.top);
    el.style.top=(top+6)+"px";

    let player=document.getElementById("player").getBoundingClientRect();
    let box=el.getBoundingClientRect();

    if(!(box.right<player.left ||
         box.left>player.right ||
         box.bottom<player.top ||
         box.top>player.bottom)){

      score++;
      document.getElementById("score").innerText="Score: "+score;

      el.remove();
      clearInterval(fall);

      checkBoss();
    }

    if(top>window.innerHeight){
      el.remove();
      clearInterval(fall);
    }

  },20);
}

/* boss trigger */
function checkBoss(){
  if(score>=25 && !bossActive){
    spawnBoss();
  }
}

/* spawn boss */
function spawnBoss(){
  bossActive=true;

  let boss=document.createElement("div");
  boss.id="boss";
  boss.innerHTML="💎 CHEST";
  boss.style.left="50%";
  boss.style.top="40%";
  boss.style.transform="translate(-50%,-50%)";

  document.getElementById("game").appendChild(boss);
  boss.style.display="block";

  boss.onclick=()=>{
    bossHits++;

    boss.style.transform="translate(-50%,-50%) scale(1.1)";
    setTimeout(()=>{
      boss.style.transform="translate(-50%,-50%) scale(1)";
    },100);

    if(bossHits>=3){
      winGame();
    }
  };
}

/* win */
function winGame(){

  document.getElementById("msg").style.display="block";
  document.getElementById("msg").innerHTML="💥 FINAL UNLOCK 💥";

  setTimeout(()=>{

    document.getElementById("msg").innerHTML=`
💖 FINAL MESSAGE TO ROUBA 💖<br><br>

هيدي اللعبة كانت بسيطة…<br>
بس الإحساس فيها حقيقي ✨<br><br>

روبا… إنتِ أجمل من كل هالنجوم 🌌<br>
وأغلى من كل الصناديق 💎<br><br>

💫 The game ends… but you stay 💫
`;

  },1200);
}

/* stars */
function stars(){
  for(let i=0;i<100;i++){
    let s=document.createElement("div");
    s.className="star";
    s.innerHTML="✦";
    s.style.left=Math.random()*100+"vw";
    s.style.fontSize=(6+Math.random()*14)+"px";
    s.style.animationDuration=(2+Math.random()*4)+"s";
    document.body.appendChild(s);
  }
}
</script>

</body>
</html>
