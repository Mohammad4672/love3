<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Ruba Final Boss 💖🔥</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  overflow: hidden;
  color: white;
  text-align: center;
  background: black;
  transition: 1s;
}

/* شاشة القفل */
#lock {
  position: fixed;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

input {
  padding: 10px;
  border-radius: 10px;
  border: none;
  text-align: center;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  border-radius: 10px;
  border: none;
  background: #ff2e63;
  color: white;
  cursor: pointer;
}

/* اللعبة */
#game { display:none; position:relative; }

#heart {
  position: absolute;
  font-size: 50px;
  cursor: pointer;
  transition: 0.1s;
  filter: drop-shadow(0 0 10px red);
}

#boss {
  position: absolute;
  font-size: 100px;
  display: none;
  cursor: pointer;
  filter: drop-shadow(0 0 20px red);
}

#score, #level {
  font-size: 20px;
  margin-top: 10px;
}

#msg {
  position: absolute;
  bottom: 20px;
  width: 100%;
  font-size: 18px;
  color: #ffb6c1;
}

/* نجوم كثيفة */
.star {
  position: absolute;
  color: white;
  animation: fall linear infinite;
  opacity: 0.9;
}

@keyframes fall {
  0% {transform: translateY(-10vh);}
  100% {transform: translateY(110vh);}
}

/* نهاية */
#finalMessage {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  font-size: 22px;
  background: rgba(0,0,0,0.8);
  padding: 25px;
  border-radius: 15px;
  display: none;
  z-index: 100;
}
</style>
</head>

<body>

<!-- القفل -->
<div id="lock">
  <h2>🔐 Password</h2>
  <input id="pass" type="password" placeholder="Enter password">
  <button onclick="start()">Enter</button>
</div>

<!-- اللعبة -->
<div id="game">
  <h1>💖 Final Boss Level</h1>
  <div id="level">Level: 10+</div>
  <div id="score">Hits: 0</div>

  <div id="heart">💖</div>
  <div id="boss">💔🔥</div>

  <div id="msg"></div>
</div>

<div id="finalMessage"></div>

<script>
const password = "RubaFinal";

let hits = 0;
let bossHits = 0;

function start(){
  if(document.getElementById("pass").value !== password){
    alert("غلط 😏");
    return;
  }

  document.getElementById("lock").style.display = "none";
  document.getElementById("game").style.display = "block";

  stars();
  spawnBoss();
}

/* قلب عادي */
let heart = document.getElementById("heart");

function moveHeart(){
  let x = Math.random()*(window.innerWidth-80);
  let y = Math.random()*(window.innerHeight-150);
  heart.style.left = x+"px";
  heart.style.top = y+"px";
}

heart.onclick = () => {
  hits++;
  document.getElementById("score").innerText = "Hits: " + hits;

  document.getElementById("msg").innerText =
    "روبا 💖 أنتِ النور الأخير في اللعبة";

  moveHeart();

  if(hits > 10){
    spawnBoss();
  }
};

/* البوس */
let boss = document.getElementById("boss");

function spawnBoss(){
  boss.style.display = "block";

  let x = Math.random()*(window.innerWidth-120);
  let y = Math.random()*(window.innerHeight-200);

  boss.style.left = x+"px";
  boss.style.top = y+"px";
}

boss.onclick = () => {
  bossHits++;

  document.getElementById("msg").innerText =
    "🔥 ضربتِ الـ Boss! ("+bossHits+"/5)";

  if(bossHits >= 5){
    winGame();
  } else {
    spawnBoss();
  }
};

/* الفوز */
function winGame(){
  document.getElementById("boss").style.display = "none";

  document.getElementById("finalMessage").style.display = "block";
  document.getElementById("finalMessage").innerHTML = `
💖 SECRET MESSAGE TO ROUBA 💖<br><br>

روبا...<br>
إذا وصلتي لهون، يعني اللعبة خلصت<br><br>

بس الحقيقة ما خلص شي…<br>
أنا كل يوم عم اختارك أكتر 💫<br><br>

وإذا هيدا العالم لعبة،<br>
فإنتِ الـ Final Boss يلي ما بدي أربح عليه 💔✨<br><br>

أنا معك لآخر نفس 💖
`;

  document.body.style.background = "radial-gradient(circle, #1a1a1a, black)";
}

/* نجوم كثيفة */
function stars(){
  for(let i=0;i<120;i++){
    let s = document.createElement("div");
    s.className = "star";
    s.innerHTML = "✦";
    s.style.left = Math.random()*100 + "vw";
    s.style.fontSize = (6 + Math.random()*16)+"px";
    s.style.animationDuration = (2 + Math.random()*4)+"s";
    document.body.appendChild(s);
  }
}

/* حركة القلب */
setInterval(moveHeart, 900);
</script>

</body>
</html>
