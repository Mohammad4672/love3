<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Ruba Levels 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle, #1a1a1a, black);
  color: white;
  text-align: center;
  overflow: hidden;
}

/* شاشة القفل */
#lock {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

input {
  padding: 10px;
  border-radius: 10px;
  border: none;
  text-align: center;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  background: #ff4d6d;
  color: white;
}

/* اللعبة */
#game { display: none; }

#heart {
  position: absolute;
  font-size: 45px;
  cursor: pointer;
  transition: 0.15s;
}

#score, #level {
  font-size: 20px;
  margin-top: 10px;
}

#msg {
  position: absolute;
  bottom: 20px;
  width: 100%;
  color: #ffb6c1;
  font-size: 18px;
}

/* Level up popup */
#popup {
  position: fixed;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #ff4d6d;
  padding: 20px;
  border-radius: 15px;
  display: none;
  font-size: 22px;
}

/* قلوب خلفية */
.bg {
  position: absolute;
  color: red;
  animation: float 6s linear infinite;
  opacity: 0.4;
}

@keyframes float {
  0% {transform: translateY(100vh);}
  100% {transform: translateY(-10vh);}
}
</style>
</head>

<body>

<!-- القفل -->
<div id="lock">
  <h2>🔐 Password</h2>
  <input id="pass" type="password" placeholder="Enter password">
  <button onclick="check()">فتح اللعبة</button>
</div>

<!-- اللعبة -->
<div id="game">
  <h1>💖 Catch the Heart</h1>
  <div id="level">Level: 1</div>
  <div id="score">Score: 0</div>
  <div id="heart">💖</div>
  <div id="msg"></div>
</div>

<div id="popup">🔥 Level Up! 🔥</div>

<script>
const password = "RubaLevel";

let score = 0;
let level = 1;
let speed = 1200;

function check(){
  if(document.getElementById("pass").value === password){
    document.getElementById("lock").style.display = "none";
    document.getElementById("game").style.display = "block";
    start();
    bgHearts();
  } else {
    alert("غلط 😏");
  }
}

let heart = document.getElementById("heart");

function moveHeart(){
  let x = Math.random() * (window.innerWidth - 60);
  let y = Math.random() * (window.innerHeight - 150);
  heart.style.left = x + "px";
  heart.style.top = y + "px";
}

heart.onclick = () => {
  score++;
  document.getElementById("score").innerText = "Score: " + score;

  let msgs = [
    "أنا معك 💖",
    "روبا ملكة 😏",
    "قلبك إلّي 💘",
    "أحلى ضحكة ✨"
  ];

  document.getElementById("msg").innerText =
    msgs[Math.floor(Math.random()*msgs.length)];

  checkLevel();
  moveHeart();
};

function checkLevel(){
  let newLevel = Math.floor(score / 5) + 1;

  if(newLevel > level){
    level = newLevel;
    document.getElementById("level").innerText = "Level: " + level;

    speed = Math.max(300, speed - 200);

    document.getElementById("popup").style.display = "block";
    setTimeout(()=> {
      document.getElementById("popup").style.display = "none";
    }, 1000);

    clearInterval(gameLoop);
    gameLoop = setInterval(moveHeart, speed);
  }
}

let gameLoop;

function start(){
  moveHeart();
  gameLoop = setInterval(moveHeart, speed);
}

/* خلفية قلوب */
function bgHearts(){
  for(let i=0;i<30;i++){
    let h = document.createElement("div");
    h.className = "bg";
    h.innerHTML = "❤";
    h.style.left = Math.random()*100 + "vw";
    h.style.fontSize = (10 + Math.random()*20) + "px";
    h.style.animationDuration = (3 + Math.random()*5) + "s";
    document.body.appendChild(h);
  }
}
</script>

</body>
</html>
